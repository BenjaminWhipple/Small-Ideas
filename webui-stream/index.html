<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portable stream monitoring and transcript interface prototype">
  <title>Stream Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#streams" aria-label="Stream Hub">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Stream Hub</span>
    </a>
    <nav class="view-tabs" aria-label="Primary navigation">
      <button class="tab is-active" type="button" data-view="streams" aria-selected="true">Streams</button>
      <button class="tab" type="button" data-view="archive" aria-selected="false">Archive</button>
    </nav>
    <div class="system-state"><span class="status-dot"></span><span>Local demo</span></div>
  </header>

  <main>
    <section id="streams-view" class="view is-active" aria-labelledby="streams-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Live overview</p>
          <h1 id="streams-heading">Streams</h1>
        </div>
        <p id="stream-summary" class="summary"></p>
      </div>

      <div class="stream-layout">
        <div id="source-grid" class="source-grid" aria-label="Live feeds"></div>
        <aside class="transcript-panel" aria-labelledby="transcript-heading">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Live transcript</p>
              <h2 id="transcript-heading">Source 01</h2>
            </div>
            <span class="live-chip"><span></span>Listening</span>
          </div>
          <div id="transcript-list" class="transcript-list" aria-live="polite"></div>
          <div class="transcript-footer">
            <span>JSONL event preview</span>
            <button id="pause-transcript" class="icon-button" type="button" aria-label="Pause transcript simulation" title="Pause transcript simulation">Ⅱ</button>
          </div>
        </aside>
      </div>
    </section>

    <section id="archive-view" class="view" aria-labelledby="archive-heading" hidden>
      <div class="section-heading">
        <div>
          <p class="eyebrow">Recorded media</p>
          <h1 id="archive-heading">Archive</h1>
        </div>
        <p id="archive-summary" class="summary"></p>
      </div>
      <div class="archive-layout">
        <div id="archive-groups" class="archive-groups"></div>
        <aside id="archive-preview" class="archive-preview" aria-live="polite"></aside>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
